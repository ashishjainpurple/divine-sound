<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Random Joke Generator - Get a laugh with random jokes from the internet">
	<meta name="theme-color" content="#FF6B6B">
	<title>Random Joke Generator</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.container {
			max-width: 600px;
			width: 100%;
		}

		.card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			padding: 40px;
			text-align: center;
			animation: slideIn 0.6s ease-out;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.header {
			margin-bottom: 30px;
		}

		.title {
			font-size: 32px;
			color: #333;
			margin-bottom: 10px;
			font-weight: bold;
		}

		.emoji {
			font-size: 48px;
			margin-bottom: 15px;
			animation: bounce 2s infinite;
		}

		@keyframes bounce {
			0%, 100% {
				transform: translateY(0);
			}
			50% {
				transform: translateY(-10px);
			}
		}

		.subtitle {
			color: #666;
			font-size: 14px;
		}

		.joke-display {
			background: #f8f9fa;
			border-left: 5px solid #667eea;
			padding: 25px;
			border-radius: 10px;
			margin: 30px 0;
			min-height: 100px;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.joke-type {
			font-size: 12px;
			color: #999;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 10px;
		}

		.joke-text {
			font-size: 18px;
			color: #333;
			line-height: 1.6;
			font-weight: 500;
		}

		.joke-setup {
			margin-bottom: 15px;
		}

		.joke-punchline {
			margin-top: 15px;
			padding-top: 15px;
			border-top: 1px solid #ddd;
			color: #667eea;
			font-weight: bold;
		}

		.loading {
			display: none;
			font-size: 14px;
			color: #667eea;
		}

		.spinner {
			display: inline-block;
			width: 16px;
			height: 16px;
			border: 3px solid rgba(102, 126, 234, 0.3);
			border-radius: 50%;
			border-top-color: #667eea;
			animation: spin 1s ease-in-out infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		.buttons {
			display: flex;
			gap: 10px;
			margin-top: 30px;
			flex-wrap: wrap;
		}

		button {
			flex: 1;
			padding: 14px 20px;
			border: none;
			border-radius: 10px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.3s ease;
			min-width: 120px;
		}

		.btn-primary {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
		}

		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
		}

		.btn-primary:active {
			transform: translateY(0);
		}

		.btn-secondary {
			background: #f0f0f0;
			color: #333;
			border: 2px solid #667eea;
		}

		.btn-secondary:hover {
			background: #667eea;
			color: white;
		}

		.btn-success {
			background: #51cf66;
			color: white;
		}

		.btn-success:hover {
			background: #40c057;
			transform: translateY(-2px);
			box-shadow: 0 10px 25px rgba(81, 207, 102, 0.4);
		}

		.stats {
			margin-top: 30px;
			padding-top: 20px;
			border-top: 1px solid #eee;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 15px;
		}

		.stat-item {
			background: #f8f9fa;
			padding: 15px;
			border-radius: 10px;
		}

		.stat-label {
			font-size: 12px;
			color: #999;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 5px;
		}

		.stat-value {
			font-size: 24px;
			font-weight: bold;
			color: #667eea;
		}

		.filter-buttons {
			display: flex;
			gap: 10px;
			margin: 20px 0;
			flex-wrap: wrap;
			justify-content: center;
		}

		.filter-btn {
			padding: 8px 16px;
			border: 2px solid #ddd;
			background: white;
			border-radius: 20px;
			cursor: pointer;
			font-size: 13px;
			transition: all 0.3s ease;
			font-weight: 500;
		}

		.filter-btn:hover,
		.filter-btn.active {
			border-color: #667eea;
			color: #667eea;
			background: #f0f4ff;
		}

		.error {
			background: #ffe0e0;
			color: #d32f2f;
			padding: 15px;
			border-radius: 10px;
			margin: 20px 0;
			display: none;
		}

		.success-message {
			background: #e8f5e9;
			color: #2e7d32;
			padding: 15px;
			border-radius: 10px;
			margin: 20px 0;
			display: none;
		}

		@media (max-width: 600px) {
			.card {
				padding: 25px;
			}

			.title {
				font-size: 24px;
			}

			.joke-text {
				font-size: 16px;
			}

			.buttons {
				flex-direction: column;
			}

			button {
				width: 100%;
			}

			.stats {
				grid-template-columns: 1fr;
			}

			.filter-buttons {
				gap: 8px;
			}

			.filter-btn {
				padding: 6px 12px;
				font-size: 12px;
			}
		}

		/* Accessibility */
		button:focus {
			outline: 2px solid #667eea;
			outline-offset: 2px;
		}

		.hidden {
			display: none;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="card">
			<div class="header">
				<div class="emoji">😂</div>
				<h1 class="title">Random Joke Generator</h1>
				<p class="subtitle">Get a laugh with random jokes!</p>
			</div>

			<div class="filter-buttons">
				<button class="filter-btn active" onclick="setFilter('any')">All Jokes</button>
				<button class="filter-btn" onclick="setFilter('general')">General</button>
				<button class="filter-btn" onclick="setFilter('programming')">Programming</button>
				<button class="filter-btn" onclick="setFilter('knock-knock')">Knock-Knock</button>
			</div>

			<div class="error" id="error"></div>
			<div class="success-message" id="successMessage"></div>

			<div class="joke-display" id="jokeDisplay">
				<div class="joke-type" id="jokeType"></div>
				<div class="joke-text" id="jokeText">
					Press "Get Joke" to load a random joke!
				</div>
			</div>

			<div class="loading" id="loading">
				<div class="spinner"></div>
				<span>Loading joke...</span>
			</div>

			<div class="buttons">
				<button class="btn-primary" onclick="getJoke()">🎯 Get Joke</button>
				<button class="btn-secondary" onclick="toggleDarkMode()">🌙 Dark Mode</button>
				<button class="btn-success" onclick="copyJoke()">📋 Copy</button>
			</div>

			<div class="stats">
				<div class="stat-item">
					<div class="stat-label">Jokes Loaded</div>
					<div class="stat-value" id="jokeCount">0</div>
				</div>
				<div class="stat-item">
					<div class="stat-label">Current Type</div>
					<div class="stat-value" id="currentType">Any</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		let jokeCount = 0;
		let currentFilter = 'any';
		let currentJoke = null;
		let darkMode = false;

		// Available joke APIs
		const jokeSources = {
			any: 'https://v2.jokeapi.dev/joke/Any',
			general: 'https://v2.jokeapi.dev/joke/General',
			programming: 'https://v2.jokeapi.dev/joke/Programming',
			'knock-knock': 'https://v2.jokeapi.dev/joke/Knock-Knock'
		};

		async function getJoke() {
			const loading = document.getElementById('loading');
			const error = document.getElementById('error');
			const jokeDisplay = document.getElementById('jokeDisplay');

			// Show loading state
			loading.style.display = 'block';
			error.style.display = 'none';

			try {
				const url = jokeSources[currentFilter] || jokeSources.any;
				const response = await fetch(url + '?format=json');

				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}

				const data = await response.json();

				if (data.error) {
					throw new Error('Failed to fetch joke');
				}

				// Store current joke
				currentJoke = data;

				// Display joke
				displayJoke(data);

				// Update counter
				jokeCount++;
				document.getElementById('jokeCount').innerText = jokeCount;

				// Update type
				const typeMap = {
					'General': 'General',
					'Programming': 'Programming',
					'Knock-Knock': 'Knock-Knock',
					'Dark': 'Dark',
					'Pun': 'Pun',
					'Spooky': 'Spooky',
					'Christmas': 'Christmas'
				};
				document.getElementById('currentType').innerText = typeMap[data.category] || data.category || 'Any';

				// Log to console
				console.log('Joke fetched:', data);

			} catch (err) {
				console.error('Error fetching joke:', err);
				error.style.display = 'block';
				error.innerText = '❌ Failed to load joke. Check your connection and try again!';
			} finally {
				loading.style.display = 'none';
			}
		}

		function displayJoke(joke) {
			const jokeDisplay = document.getElementById('jokeDisplay');
			const jokeType = document.getElementById('jokeType');
			const jokeText = document.getElementById('jokeText');

			jokeType.innerText = `${joke.category || 'General'} • ${joke.type === 'single' ? 'Single' : 'Two-part'}`;

			if (joke.type === 'single') {
				jokeText.innerHTML = `<div class="joke-text">${escapeHtml(joke.joke)}</div>`;
			} else {
				jokeText.innerHTML = `
					<div class="joke-setup">${escapeHtml(joke.setup)}</div>
					<div class="joke-punchline">${escapeHtml(joke.delivery)}</div>
				`;
			}

			// Add animation
			jokeDisplay.style.animation = 'none';
			setTimeout(() => {
				jokeDisplay.style.animation = 'slideIn 0.6s ease-out';
			}, 10);
		}

		function escapeHtml(text) {
			const div = document.createElement('div');
			div.textContent = text;
			return div.innerHTML;
		}

		function copyJoke() {
			if (!currentJoke) {
				alert('No joke to copy! Get a joke first.');
				return;
			}

			let jokeText = '';
			if (currentJoke.type === 'single') {
				jokeText = currentJoke.joke;
			} else {
				jokeText = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
			}

			navigator.clipboard.writeText(jokeText).then(() => {
				const successMessage = document.getElementById('successMessage');
				successMessage.style.display = 'block';
				successMessage.innerText = '✅ Joke copied to clipboard!';
				setTimeout(() => {
					successMessage.style.display = 'none';
				}, 3000);
			}).catch(() => {
				alert('Failed to copy joke');
			});
		}

		function setFilter(filter) {
			currentFilter = filter;

			// Update button states
			document.querySelectorAll('.filter-btn').forEach(btn => {
				btn.classList.remove('active');
			});
			event.target.classList.add('active');

			// Clear current joke
			currentJoke = null;
			document.getElementById('jokeDisplay').innerHTML = `
				<div class="joke-type"></div>
				<div class="joke-text">Press "Get Joke" to load a ${filter === 'any' ? 'random' : filter} joke!</div>
			`;

			// Auto-load new joke
			getJoke();
		}

		function toggleDarkMode() {
			darkMode = !darkMode;
			document.body.style.background = darkMode 
				? 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)' 
				: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';

			const card = document.querySelector('.card');
			const isDark = darkMode;
			card.style.background = isDark ? '#2d2d44' : 'white';
			card.style.color = isDark ? 'white' : '#333';

			// Update other elements for dark mode
			document.querySelectorAll('.joke-display').forEach(el => {
				el.style.background = isDark ? '#3d3d54' : '#f8f9fa';
				el.style.color = isDark ? 'white' : '#333';
				el.style.borderLeftColor = isDark ? '#9db4ff' : '#667eea';
			});

			document.querySelectorAll('.stat-item').forEach(el => {
				el.style.background = isDark ? '#3d3d54' : '#f8f9fa';
				el.style.color = isDark ? 'white' : '#333';
			});

			document.querySelectorAll('.title').forEach(el => {
				el.style.color = isDark ? 'white' : '#333';
			});

			document.querySelectorAll('.joke-text').forEach(el => {
				el.style.color = isDark ? 'white' : '#333';
			});
		}

		// Load initial joke on page load
		window.addEventListener('load', () => {
			getJoke();
		});

		// Keyboard shortcut (Space to get joke)
		document.addEventListener('keydown', (e) => {
			if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
				e.preventDefault();
				getJoke();
			}
		});
	</script>
</body>

</html>
