<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NFC Divine Sound</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: Arial, sans-serif;
			color: white;
			background: linear-gradient(160deg, #190008, #4b1d00, #050005);
			min-height: 100vh;
			padding: 20px;
		}
		.card {
			max-width: 500px;
			margin: auto;
			background: rgba(255,255,255,0.09);
			border: 1px solid #ffd36a;
			border-radius: 20px;
			padding: 25px;
		}
		.logo { color: #ffd36a; font-size: 24px; font-weight: bold; }
		h2 { color: #ffd36a; font-size: 18px; margin: 15px 0 10px; }
		input, select {
			width: 100%;
			padding: 10px;
			margin: 8px 0;
			border: 1px solid #ffd36a;
			border-radius: 8px;
			background: rgba(255,255,255,0.1);
			color: white;
		}
		button {
			width: 100%;
			padding: 12px;
			margin: 8px 0;
			border: none;
			border-radius: 8px;
			background: #ffd36a;
			color: #2b1200;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover { opacity: 0.9; }
		audio { width: 100%; margin: 15px 0; }
		.status { color: #ffd36a; margin: 10px 0; font-size: 12px; }
		.nfc-status {
			padding: 10px;
			margin: 10px 0;
			border-radius: 8px;
			font-weight: bold;
			background: rgba(76,175,80,0.2);
			border: 1px solid #4caf50;
		}
		.item {
			background: rgba(255,211,106,0.1);
			padding: 10px;
			margin: 8px 0;
			border-radius: 8px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.del-btn {
			background: #d32f2f;
			color: white;
			padding: 5px 10px;
			width: auto;
			margin: 0;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="logo">📱 NFC DIVINE SOUND</div>
		<div style="color: #c9b27c; font-size: 12px; margin-bottom: 15px;">Save sounds and tap NFC to play</div>

		<div class="nfc-status" id="nfcStatus">✅ Ready to detect NFC</div>

		<h2 id="title">Tap NFC to Play</h2>
		<audio id="player" controls></audio>
		<button onclick="playSound()">▶ PLAY</button>
		<button onclick="stopSound()" style="background: #666;">■ STOP</button>

		<div class="status" id="status">Waiting for NFC...</div>

		<h2>Add New Sound</h2>
		<input type="text" id="soundName" placeholder="Sound name">
		<input type="url" id="audioUrl" placeholder="Audio URL">
		<button onclick="saveSound()">💾 SAVE SOUND</button>

		<h2>Saved Sounds</h2>
		<div id="soundsList"></div>

		<h2>Write to NFC Tag</h2>
		<select id="nfcSoundSelect">
			<option value="">Select sound to write...</option>
		</select>
		<button onclick="writeNFC()">✍️ WRITE NFC TAG</button>
	</div>

	<script>
		let currentSound = null;

		window.addEventListener('load', () => {
			loadSounds();
			scanNFC();
		});

		function saveSound() {
			const name = document.getElementById('soundName').value;
			const url = document.getElementById('audioUrl').value;
			if (!name || !url) { alert('Fill all fields'); return; }

			let sounds = JSON.parse(localStorage.getItem('sounds')) || {};
			sounds[name] = url;
			localStorage.setItem('sounds', JSON.stringify(sounds));

			document.getElementById('soundName').value = '';
			document.getElementById('audioUrl').value = '';
			document.getElementById('status').innerText = '✅ Saved: ' + name;
			loadSounds();
		}

		function loadSounds() {
			const sounds = JSON.parse(localStorage.getItem('sounds')) || {};
			const list = document.getElementById('soundsList');
			const select = document.getElementById('nfcSoundSelect');

			list.innerHTML = '';
			select.innerHTML = '<option value="">Select sound...</option>';

			Object.entries(sounds).forEach(([name, url]) => {
				const item = document.createElement('div');
				item.className = 'item';
				item.innerHTML = `<span>${name}</span><button class="del-btn" onclick="deleteSound('${name}')">Delete</button>`;
				list.appendChild(item);

				const opt = document.createElement('option');
				opt.value = name;
				opt.text = name;
				select.appendChild(opt);
			});
		}

		function deleteSound(name) {
			if (confirm('Delete ' + name + '?')) {
				let sounds = JSON.parse(localStorage.getItem('sounds')) || {};
				delete sounds[name];
				localStorage.setItem('sounds', JSON.stringify(sounds));
				loadSounds();
			}
		}

		function playSound() {
			if (!currentSound) { alert('No sound loaded'); return; }
			document.getElementById('player').play();
		}

		function stopSound() {
			const p = document.getElementById('player');
			p.pause();
			p.currentTime = 0;
		}

		async function scanNFC() {
			if (!('NDEFReader' in window)) {
				document.getElementById('status').innerText = '⚠️ NFC not supported';
				return;
			}

			try {
				const ndef = new NDEFReader();
				await ndef.scan();
				document.getElementById('status').innerText = '📡 Scanning...';

				ndef.onreading = (e) => {
					const decoder = new TextDecoder();
					const sound = decoder.decode(e.message.records[0].data);
					const sounds = JSON.parse(localStorage.getItem('sounds')) || {};

					if (sounds[sound]) {
						currentSound = sound;
						const url = sounds[sound];
						document.getElementById('title').innerText = sound;
						document.getElementById('player').src = url;
						document.getElementById('player').play();
						document.getElementById('status').innerText = '✅ NFC: ' + sound;
						document.getElementById('nfcStatus').innerText = '✅ Detected: ' + sound;
					}
				};
			} catch (err) {
				console.log('NFC error:', err);
			}
		}

		async function writeNFC() {
			const sound = document.getElementById('nfcSoundSelect').value;
			if (!sound) { alert('Select sound'); return; }

			try {
				const ndef = new NDEFReader();
				await ndef.write({
					records: [{ recordType: 'text', data: sound }]
				});
				document.getElementById('status').innerText = '✅ NFC written: ' + sound;
				setTimeout(() => scanNFC(), 1000);
			} catch (err) {
				alert('Write failed: ' + err);
			}
		}
	</script>
</body>
</html>
